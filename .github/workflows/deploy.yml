name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Two sessions push often: a newer deploy replaces a running one instead of failing on it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check component documentation standard
        run: |
          python scripts/check_components.py --lang en
          python scripts/gen_component_indexes.py --lang en --check
          python scripts/check_components.py --lang de
          python scripts/gen_component_indexes.py --lang de --check
          python scripts/gen_frontend_indexes.py --check

      - name: Publish the decision records (copied from conventions/decisions)
        run: python scripts/gen_decisions.py

      - name: Build MkDocs site
        run: |
          mkdocs build --strict

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

