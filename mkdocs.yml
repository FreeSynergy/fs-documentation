site_name: FreeSynergy.Documentation
site_url: https://freesynergy.github.io/fs-documentation/
site_author: FreeSynergy Team
site_description: >-
  Official documentation for FreeSynergy — multi-language, open-source tools, collaboration, and knowledge transfer.

repo_name: FreeSynergy/fs-documentation
repo_url: https://github.com/FreeSynergy/fs-documentation
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - search.suggest
    - search.highlight
    - navigation.tracking
    - navigation.sections
    - toc.integrate

# Plugins
plugins:
  - search

