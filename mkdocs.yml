site_name: FreeSynergy.Documentation
site_url: https://freesynergy.github.io/fs-documentation/
site_author: FreeSynergy Team
site_description: >-
  Official documentation for FreeSynergy — multi-language, open-source tools, collaboration, and knowledge transfer.

repo_name: FreeSynergy/fs-documentation
repo_url: https://github.com/FreeSynergy/fs-documentation
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - search.suggest
    - search.highlight
    - navigation.tracking
    - navigation.sections
    - toc.integrate

# Plugins
plugins:
  - search

# Navigation
nav:
  - Home:
      - Deutsch: de/index.md
      - English: en/index.md
  - de/apps/: de/apps/index.md
  - de/apps/wiki/: de/apps/wiki/index.md
  - en/apps/wiki/: en/apps/wiki/index.md
  - de/apps/messenger/: de/apps/messenger/index.md
  - en/apps/messenger/: en/apps/messenger/index.md
  - de/apps/marketing/: de/apps/marketing/index.md
  - en/apps/marketing/: en/apps/marketing/index.md
  - de/apps/whiteboards/: de/apps/whiteboards/index.md
  - en/apps/whiteboards/: en/apps/whiteboards/index.md
  - de/apps/helpdesk/: de/apps/helpdesk/index.md
  - en/apps/helpdesk/: en/apps/helpdesk/index.md
  - de/apps/projectmanagement/: de/apps/projectmanagement/index.md
  - en/apps/projectmanagement/: en/apps/projectmanagement/index.md
  - de/apps/contact/: de/apps/contact/index.md
  - en/apps/contact/: en/apps/contact/index.md
  - de/apps/calendar/: de/apps/calendar/index.md
  - en/apps/calendar/: en/apps/calendar/index.md
  - de/apps/desktop/: de/apps/desktop/index.md
  - en/apps/desktop/: en/apps/desktop/index.md
  - de/apps/crm/: de/apps/crm/index.md
  - en/apps/crm/: en/apps/crm/index.md
  - de/apps/democracy/: de/apps/democracy/index.md
  - de/apps/marketplace/: de/apps/marketplace/index.md
  - en/apps/democracy/: en/apps/democracy/index.md
  - de/apps/maps/: de/apps/maps/index.md
  - de/apps/maps/standpunkte: de/apps/maps/standpunkte.md
  - en/apps/maps/: en/apps/maps/index.md
  - de/apps/erp/: de/apps/erp/index.md
  - en/apps/erp/: en/apps/erp/index.md
  - de/apps/workflows/: de/apps/workflows/index.md
  - en/apps/workflows/: en/apps/workflows/index.md
  - de/gestures/: de/gestures/index.md
  - en/gestures/: en/gestures/index.md
  - de/animations/: de/animations/index.md
  - en/animations/: en/animations/index.md
  - de/data/: de/data/index.md
  - en/data/: en/data/index.md
  - de/components/: de/components/index.md

# Extra CSS/JS (optional für spätere Erweiterungen)
#extra_css:
#  - assets/extra.css

# Copyright
copyright: |
  &copy; 2025 <a href="https://github.com/FreeSynergy" target="_blank" rel="noopener">FreeSynergy</a>
  
# Markdown extensions
markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra configuration
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FreeSynergy
      name: FreeSynergy on GitHub
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/freesynergy
      name: FreeSynergy on GitLab (coming soon)

# Directory settings
docs_dir: docs
site_dir: site

#hooks:
#  - hooks/pre_build.py
#  - hooks/post_build.py
