# Extra CSS/JS (optional für spätere Erweiterungen)
#extra_css:
#  - assets/extra.css

# Copyright
copyright: |
  &copy; 2025 <a href="https://github.com/FreeSynergy" target="_blank" rel="noopener">FreeSynergy</a>
  
# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra configuration
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FreeSynergy
      name: FreeSynergy on GitHub
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/freesynergy
      name: FreeSynergy on GitLab (coming soon)

# Directory settings
docs_dir: docs
site_dir: site

#hooks:
#  - hooks/pre_build.py
#  - hooks/post_build.py
