site_name: FreeSynergy.Documentation
site_url: https://freesynergy.github.io/fs-documentation/
site_author: FreeSynergy Team
site_description: >-
  Official documentation for FreeSynergy — multi-language, open-source tools, collaboration, and knowledge transfer.

repo_name: FreeSynergy/fs-documentation
repo_url: https://github.com/FreeSynergy/fs-documentation
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - search.suggest
    - search.highlight
    - navigation.tracking
    - navigation.sections
    - toc.integrate

# Plugins
plugins:
  - search
  - multilingual:
      default_language: de
      languages:
        - name: English
          locale: en
          build: true
          directory: en
        - name: Deutsch
          locale: de
          build: true
          directory: de
        - name: Français
          locale: fr
          build: true
          directory: fr

# Navigation
nav:
  - Home: index.md
  - de/: de/
  - en/: en/
  - fr/: fr/

# Extra CSS/JS (optional für spätere Erweiterungen)
#extra_css:
#  - assets/extra.css

# Copyright
copyright: |
  &copy; 2025 <a href="https://github.com/FreeSynergy" target="_blank" rel="noopener">FreeSynergy</a>
  
# Markdown extensions
markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra configuration
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FreeSynergy
      name: FreeSynergy on GitHub
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/freesynergy
      name: FreeSynergy on GitLab (coming soon)

# Directory settings
docs_dir: docs
site_dir: site

#hooks:
#  - hooks/pre_build.py
#  - hooks/post_build.py
