site_name: FreeSynergy
site_url: https://freesynergy.github.io/fs-documentation/
site_author: FreeSynergy Team
site_description: >-
  Software that follows you, not the other way round. Free, open, for everyone.

repo_name: FreeSynergy/fs-documentation
repo_url: https://github.com/FreeSynergy/fs-documentation
edit_uri: edit/main/docs/

# Theme: own colours (docs/assets/extra.css), no web font (system fonts only: no request to a third party).
theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/extra.css

# Plugins. Top level of the menu is listed in `nav`, below it the menu follows the folders (awesome-pages);
# German and English are two folders, docs/en/ is the source (i18n).
plugins:
  - search
  - awesome-pages
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav_translations:
            1 Programs: Programs
            2 Interfaces: Interfaces
            3 Components: Components
            4 Interactions: Interactions
            5 Data standards: Data standards
            6 Manifesto: Manifesto
            7 Decisions: Decisions
            0 Get started: Get started
        - locale: de
          name: Deutsch
          build: true
          site_name: FreeSynergy
          nav_translations:
            1 Programs: Programme
            2 Interfaces: Schnittstellen
            3 Components: Bausteine
            4 Interactions: Interaktionen
            5 Data standards: Datenstandards
            6 Manifesto: Manifest
            7 Decisions: Entscheidungen
            0 Get started: Loslegen

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra configuration
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FreeSynergy
      name: FreeSynergy on GitHub

docs_dir: docs
site_dir: site

copyright: |
  &copy; FreeSynergy &middot; <a href="https://github.com/FreeSynergy" target="_blank" rel="noopener">GitHub</a>
