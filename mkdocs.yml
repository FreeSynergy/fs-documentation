site_name: FreeSynergy.Documentation
site_url: https://freesynergy.github.io/fs-documentation/
site_author: FreeSynergy Team
site_description: >-
  Official documentation for FreeSynergy — multi-language, open-source tools, collaboration, and knowledge transfer.

repo_name: FreeSynergy/fs-documentation
repo_url: https://github.com/FreeSynergy/fs-documentation
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - search.suggest
    - search.highlight
    - navigation.tracking
    - navigation.sections
    - toc.integrate

# Plugins
plugins:
  - search

# Navigation
nav:
  - Home:
      - Deutsch: de/
      - English: en/
      - Français: fr/
  - de/apps/wiki/: de/apps/wiki/
  - en/apps/wiki/: en/apps/wiki/
  - fr/apps/wiki/: fr/apps/wiki/
  - de/apps/messenger/: de/apps/messenger/
  - en/apps/messenger/: en/apps/messenger/
  - fr/apps/messenger/: fr/apps/messenger/
  - de/apps/components/: de/apps/components/
  - en/apps/components/: en/apps/components/
  - fr/apps/components/: fr/apps/components/
  - de/apps/marketing/: de/apps/marketing/
  - en/apps/marketing/: en/apps/marketing/
  - fr/apps/marketing/: fr/apps/marketing/
  - de/apps/whiteboards/: de/apps/whiteboards/
  - en/apps/whiteboards/: en/apps/whiteboards/
  - fr/apps/whiteboards/: fr/apps/whiteboards/
  - de/apps/helpdesk/: de/apps/helpdesk/
  - en/apps/helpdesk/: en/apps/helpdesk/
  - fr/apps/helpdesk/: fr/apps/helpdesk/
  - de/apps/projektmanagement/: de/apps/projektmanagement/
  - en/apps/projektmanagement/: en/apps/projektmanagement/
  - fr/apps/projektmanagement/: fr/apps/projektmanagement/
  - de/apps/kontakt/: de/apps/kontakt/
  - en/apps/kontakt/: en/apps/kontakt/
  - fr/apps/kontakt/: fr/apps/kontakt/
  - de/apps/kalender/: de/apps/kalender/
  - en/apps/kalender/: en/apps/kalender/
  - fr/apps/kalender/: fr/apps/kalender/
  - de/apps/desktop/: de/apps/desktop/
  - en/apps/desktop/: en/apps/desktop/
  - fr/apps/desktop/: fr/apps/desktop/
  - de/apps/crm/: de/apps/crm/
  - en/apps/crm/: en/apps/crm/
  - fr/apps/crm/: fr/apps/crm/
  - de/apps/demokratie/: de/apps/demokratie/
  - en/apps/demokratie/: en/apps/demokratie/
  - fr/apps/demokratie/: fr/apps/demokratie/
  - de/apps/maps/: de/apps/maps/
  - en/apps/maps/: en/apps/maps/
  - fr/apps/maps/: fr/apps/maps/
  - de/apps/erp/: de/apps/erp/
  - en/apps/erp/: en/apps/erp/
  - fr/apps/erp/: fr/apps/erp/
  - de/apps/workflows/: de/apps/workflows/
  - en/apps/workflows/: en/apps/workflows/
  - fr/apps/workflows/: fr/apps/workflows/

# Extra CSS/JS (optional für spätere Erweiterungen)
#extra_css:
#  - assets/extra.css

# Copyright
copyright: |
  &copy; 2025 <a href="https://github.com/FreeSynergy" target="_blank" rel="noopener">FreeSynergy</a>
  
# Markdown extensions
markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra configuration
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FreeSynergy
      name: FreeSynergy on GitHub
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/freesynergy
      name: FreeSynergy on GitLab (coming soon)

# Directory settings
docs_dir: docs
site_dir: site

#hooks:
#  - hooks/pre_build.py
#  - hooks/post_build.py
